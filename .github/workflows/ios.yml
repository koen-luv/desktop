name: iOS IPA

on:
  workflow_dispatch:
  push:
    # The `mobile` branch carries the mobile ports (Android + iOS); every push
    # there rebuilds the unsigned IPA.
    branches:
      - mobile
    tags:
      - "v*"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web renderer
        run: pnpm build

      - name: Sync renderer into the iOS bundle
        run: bash ios/sync-web.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Read app version
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Archive app (unsigned)
        run: |
          xcodebuild \
            -project ios/Liner.xcodeproj \
            -scheme Liner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build/DerivedData \
            -archivePath ios/build/Liner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="ios/build/Liner.xcarchive/Products/Applications/Liner.app"
          test -d "$APP"
          rm -rf ios/build/Payload Liner-unsigned.ipa
          mkdir -p ios/build/Payload
          cp -R "$APP" ios/build/Payload/
          (cd ios/build && ditto -c -k --sequesterRsrc --keepParent Payload ../../Liner-unsigned.ipa)
          ls -lh Liner-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liner-${{ steps.version.outputs.value }}-unsigned-ipa
          path: Liner-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Liner-unsigned.ipa
