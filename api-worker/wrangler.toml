name = "liner-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET, TURNSTILE_SECRET
# Optional: STREAM_SIGNING_SECRET signs /v1/stream tokens (falls back to
# JWT_SECRET). Setting it lets you rotate stream URLs independently.

[vars]
# off | optional | required. Turnstile only becomes active when both
# TURNSTILE_SITE_KEY and the TURNSTILE_SECRET secret are present.
# optional: the widget is shown and tokens are verified, but a failed widget
# never locks a client out. Use "required" to reject sign-ins without a token.
TURNSTILE_MODE = "optional"
TURNSTILE_SITE_KEY = "0x4AAAAAAFwIpK7QKp-h3zap"
# "*" lets the desktop, Android, iOS and browser builds call the Worker from
# any origin. Use a comma-separated allowlist if you only ship web clients.
ALLOWED_ORIGINS = "*"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_DAYS = "30"

[observability]
enabled = true
