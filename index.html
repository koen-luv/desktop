<!DOCTYPE html>
<html lang="en" class="antialiased bg-transparent" suppresshydrationwarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neritium</title>
    <meta
      name="description"
      content="Neritium plays the music library you own — playlists, synced lyrics, downloads and background playback."
    />
    <meta name="referrer" content="no-referrer" />

    <!-- Browser build: paint the system UI in the app's own surface colour. -->
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neritium" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
    />
    <style>
      :root {
        --font-inter: 'Inter', sans-serif;
        --font-geist-sans: 'Geist', sans-serif;
        --font-geist-mono: 'Geist Mono', monospace;
        color-scheme: light dark;
      }
      /* The shell owns all padding (safe areas, window gaps), so the document
         background is transparent and never adds a second inset. */
      html,
      body {
        background: transparent;
      }
    </style>
  </head>
  <body class="h-full w-full bg-transparent overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
